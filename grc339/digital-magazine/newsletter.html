<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>THE DROP</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="stylesheet" href="https://use.typekit.net/mjv2lfk.css">
  </head>
  <body>
    <div class="newsletter-container">
      <header>
        <h1><a href="index.html"><img src="the-drop-logo.svg" alt="The Drop Logo"></a></h1>
        <nav>
          <ul>
            <li><a href="#">Now Trending</a></li>
            <li><a href="#">Watchlist</a></li>
            <li><a href="#">The Drop List</a></li>
            <li><a href="#">Culture</a></li>
            <li><a href="newsletter.html">Newsletter</a></li>
          </ul>
        </nav>
      </header>
      <main class="newsletter-main">
        <form class="newsletter-form">
          <section class="personal-info">
            <h2 class="newsletter">Subscribe to our Newsletter!</h2>
            <h3 class="newsletter">Personal Information:</h3>
            <ul>
              <li><label for="name">Name:</label><input type="text" name="name" id="name" placeholder="your full name" /></li>
              <li><label for="email">Email:</label><input type="email" name="email" id="email" placeholder="your email" /></li>
              <li><label for="phone">Phone:</label><input type="tel" name="phone" id="phone" placeholder="your phone number" /></li>
              <li><label for="city">City:</label><input type="text" name="city" id="city" placeholder="city" /></li>
              <li><label for="address">Address:</label><input type="text" name="address" id="address" placeholder="your address" /></li>
              <li><label for="state">State:</label><select id="state" name="state">
                  <option value=""></option>
                  <option value="AZ">Arizona</option>
                  <option value="AR">Arkansas</option>
                  <option value="CA">California</option>
                  <option value="CO">Colorado</option>
                  <option value="CT">Connecticut</option>
                  <option value="DE">Delaware</option>
                  <option value="DC">District Of Columbia</option>
                  <option value="FL">Florida</option>
                  <option value="GA">Georgia</option>
                  <option value="HI">Hawaii</option>
                  <option value="ID">Idaho</option>
                  <option value="IL">Illinois</option>
                  <option value="IN">Indiana</option>
                  <option value="IA">Iowa</option>
                  <option value="KS">Kansas</option>
                  <option value="KY">Kentucky</option>
                  <option value="LA">Louisiana</option>
                  <option value="ME">Maine</option>
                  <option value="MD">Maryland</option>
                  <option value="MA">Massachusetts</option>
                  <option value="MI">Michigan</option>
                  <option value="MN">Minnesota</option>
                  <option value="MS">Mississippi</option>
                  <option value="MO">Missouri</option>
                  <option value="MT">Montana</option>
                  <option value="NE">Nebraska</option>
                  <option value="NV">Nevada</option>
                  <option value="NH">New Hampshire</option>
                  <option value="NJ">New Jersey</option>
                  <option value="NM">New Mexico</option>
                  <option value="NY">New York</option>
                  <option value="NC">North Carolina</option>
                  <option value="ND">North Dakota</option>
                  <option value="OH">Ohio</option>
                  <option value="OK">Oklahoma</option>
                  <option value="OR">Oregon</option>
                  <option value="PA">Pennsylvania</option>
                  <option value="RI">Rhode Island</option>
                  <option value="SC">South Carolina</option>
                  <option value="SD">South Dakota</option>
                  <option value="TN">Tennessee</option>
                  <option value="TX">Texas</option>
                  <option value="UT">Utah</option>
                  <option value="VT">Vermont</option>
                  <option value="VA">Virginia</option>
                  <option value="WA">Washington</option>
                  <option value="WV">West Virginia</option>
                  <option value="WI">Wisconsin</option>
                  <option value="WY">Wyoming</option>
                </select></li>
              <li><label for="zip-code">Zip code:</label><input type="text" name="zip-code" id="zip-code" placeholder="zip code" /></li>
            </ul>
          </section>
          <section class="subscribe">
            <h3>How would you like to subscribe?</h3>
            <ul>
              <li><input type="radio" id="weekly" value="weekly" name="Subscription" /><label for="weekly">Weekly | $2.99 per week </label></li>
              <li><input type="radio" id="monthly" value="monthly" name="Subscription" /><label for="monthly">Monthly | $9.99 per month</label></li>
              <li><input type="radio" id="annual" value="annual" name="Subscription" /><label for="annual">Annual | $99.99 a year</label></li>
            </ul>
          </section>
          <section class="subscription">
            <h3 class="newsletter">Select the type of newsletters you'd like to receive:</h3>
            <ul>
              <li><input type="checkbox" id="Featured-newsletter" value="Featured-newsletter" /><label for="Featured-newsletter">Featured Newsletter</label></li>
              <li><input type="checkbox" id="Announcements" value="Announcements" /><label for="Announcements">Announcements</label></li>
              <li><input type="checkbox" id="General-Updates" value="General-Updates" /><label for="General-Updates">General Updates</label></li>
              <li><input type="checkbox" id="Promotions" value="Promotions" /><label for="Promotions">Promotions</label></li>
            </ul>
          </section>
          <section class="payment">
            <h3>Payment Type:</h3>
            <ul>
              <li><input type="radio" id="credit-debit" value="credit-debit" name="payment" /><label for="credit-debit">Credit / Debit</label></li>
              <li><input type="radio" id="paypal" value="paypal" name="payment" /><label for="paypal">PayPal</label></li>
              <li><input type="radio" id="other" value="other" name="payment" /><label for="other">Other</label></li>
            </ul>
          </section>
          <section><button type="subscribe">Subscribe</button></section>
      </main>
      </form>
      <footer>
        <p> All rights reserved. </p>
      </footer>
    </div>
  </body>
</html>
